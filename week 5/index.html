<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grade Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding-top: 50px;
      color: white;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 25px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
    }

    input {
      width: 300px;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1.1rem;
      transition: background 0.3s ease;
    }

    input::placeholder {
      color: rgba(255,255,255,0.7);
    }

    input:focus {
      background: rgba(255,255,255,0.25);
    }

    button {
      width: 200px;
      padding: 14px;
      margin: 10px;
      border: none;
      border-radius: 25px;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease;
    }

    button:hover {
      background: rgba(255,255,255,0.35);
      color: #fff;
    }

    #results {
      margin-top: 30px;
      width: 80%;
      max-width: 600px;
      background: rgba(255,255,255,0.15);
      border-radius: 15px;
      padding: 20px;
    }

    .student {
      margin: 8px 0;
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    h3 {
      margin-bottom: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Student Grade Tracker</h1>

  <input type="text" id="name" placeholder="Enter Student Name"><br>
  <input type="number" id="marks" placeholder="Enter Marks"><br>

  <button type="button" onclick="addStudent()">Add Student</button><br>
  <button type="button" onclick="showResults()">Show Grades</button>

  <div id="results"></div>

  <script>
   let students = [];

function addStudent() {
    let name = document.getElementById("name").value;
    let marks = parseFloat(document.getElementById("marks").value);

    if (name && !isNaN(marks)) {
        students.push({ name: name, marks: marks });
        document.getElementById("name").value = "";
        document.getElementById("marks").value = "";
        alert("Student added!");
    } else {
        alert("Please enter valid name and marks");
    }
}

// ✅ Missing function added here
function getGrade(marks) {
    if (marks >= 90) return "A+";
    else if (marks >= 80) return "A";
    else if (marks >= 70) return "B";
    else if (marks >= 60) return "C";
    else if (marks >= 50) return "D";
    else return "F";
}

function showResults() {
    let output = "<h3>Results:</h3>";
    students.forEach(student => {
        let grade = getGrade(student.marks);
        output += `<div class="student">${student.name} scored ${student.marks} marks - Grade: ${grade}</div>`;
    });
    document.getElementById("results").innerHTML = output;
}
  </script>
</body>
</html>
